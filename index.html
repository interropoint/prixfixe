<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>prixfixe</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #f7f7f7;
				color: #222;
				font-family: sans-serif;
			}
			main {
				width: min(100% - 3rem, 50rem);
				line-height: 1.5;
			}
			p {
				margin: 0;
			}
			.byline {
				margin-top: 0.25rem;
				color: #888;
				font-size: 0.9rem;
			}
			a {
				color: inherit;
				text-decoration: underline;
				transition: color 200ms, font-weight 200ms;
			}
			.brand-link {
				font-weight: 700;
			}
			a:hover,
			a:focus {
				color: #000;
				font-weight: 400;
				outline: none;
			}
			::selection {
				background: aliceblue;
			}
		</style>
	</head>
	<body>
		<main>
			<p><a class="brand-link" href="https://github.com/interropoint/prixfixe" target="_blank" rel="noopener noreferrer">prixfixe</a> (“prefix”, roughly) is small software for making menus.</p>
			<p class="byline">an <a href="https://github.com/interropoint" target="_blank" rel="noopener noreferrer">interrobang</a> project</p>
		</main>
	</body>
</html>
